    <circle cx="40" cy="196" r="6"/><circle cx="226" cy="210" r="6"/><circle cx="166" cy="46" r="6"/>
  </g>
  <rect x="10" y="10" width="236" height="236" rx="46" fill="none" stroke="#1ad9cc" stroke-width="5"/>

