<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#0f2a30"/>
      <stop offset="1" stop-color="#03070c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#ff7fc0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff4fa8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b0bf"/>
      <stop offset="1" stop-color="#e08497"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8a90"/>
      <stop offset="0.5" stop-color="#e8f2f4"/>
      <stop offset="1" stop-color="#6a767c"/>
    </linearGradient>
    <clipPath id="plate"><rect x="8" y="8" width="240" height="240" rx="48"/></clipPath>
  </defs>

